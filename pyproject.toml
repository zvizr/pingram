[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pingram"
version = "0.5.1"
description = "Minimal Telegram alerting framework for bots and scripts."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "zvizr" }]

dependencies = ["httpx"]

keywords = [
  "telegram", "bot", "alert", "notification", "notifier", "push",
  "messaging", "python", "minimal", "selfhosted", "cli",
  "automation", "infra", "monitoring", "async"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.21", "ruff>=0.5", "python-dotenv>=1.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/zvizr/pingram"
Repository = "https://github.com/zvizr/pingram"
Issues = "https://github.com/zvizr/pingram/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
markers = [
    "integration: real-API tests; require BOT_TOKEN + CHAT_ID env vars",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
